<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Brushed chrome / silver plate gradient -->
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#f1f5f9"/>
      <stop offset="36%" stop-color="#e2e8f0"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#94a3b8"/>
      <stop offset="68%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Metallic bevel rim highlight -->
    <linearGradient id="silver-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#64748b" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glossy specular reflection sheen -->
    <linearGradient id="silver-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle inner shadow gradient for emblem -->
    <linearGradient id="mark-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
  </defs>

  <!-- Plate -->
  <rect width="512" height="512" rx="96" fill="url(#silver-metal)"/>
  <!-- Bevel border -->
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="url(#silver-rim)" stroke-width="4"/>
  <!-- Top specular sheen -->
  <rect width="512" height="512" rx="96" fill="url(#silver-sheen)"/>

