name: docs-check

# Assumes this site lives in <koto-repo>/docs. Adjust `working-directory` and the koto path if you move it.
on:
  push:
    paths: ['docs/**', 'include/**', 'src/**']
  pull_request:
    paths: ['docs/**', 'include/**', 'src/**']

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: docs/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: No broken internal links
        run: python3 tools/check-links.py dist
